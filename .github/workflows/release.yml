name: Build and Release Frosty

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Собираем однофайловый Frosty.exe
        run: dotnet publish src/Frosty.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Создаем релиз и прикрепляем Frosty.exe
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/Frosty.exe
          draft: true
